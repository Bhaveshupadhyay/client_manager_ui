<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Client Manager</title>
    <meta name="description" content="Describe your software project and get help scoping features, stack, budget and timeline.">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FWVLD04NV3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FWVLD04NV3', {
            'send_page_view': true
        });
    </script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="left-sidebar">
            <div class="sidebar-top">
                <a href="index.html" class="brand">AI Client Manager</a>
                <button class="icon-btn sidebar-close" id="sidebar-close" title="Close sidebar" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <button class="sidebar-item" id="new-chat-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                New chat
            </button>

            <div class="sidebar-heading">Explore</div>
            <nav class="sidebar-nav main-nav">
                <a href="service.html" class="sidebar-item">Services</a>
                <a href="portfolio.html" class="sidebar-item">Work</a>
                <a href="testimonials.html" class="sidebar-item">Reviews</a>
                <a href="about.html" class="sidebar-item">About</a>
                <a href="contact.html" class="sidebar-item">Contact</a>
            </nav>

            <div class="sidebar-bottom">
                <button class="sidebar-item" id="theme-toggle">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    Toggle theme
                </button>
                <a href="https://www.fiverr.com/coderandroid" target="_blank" rel="noopener noreferrer" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Hire on Fiverr
                </a>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <main class="chat-main is-empty" id="chat-main">
            <header class="chat-topbar">
                <button class="icon-btn mobile-only" id="mobile-menu-toggle" title="Open sidebar" aria-label="Open sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
                </button>
                <span class="chat-title">AI Client Manager</span>
                <button class="icon-btn" id="clear-chat-btn" title="New chat" aria-label="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
            </header>

            <div class="chat-scroll" id="chat-scroll">
                <div class="chat-empty">
                    <h1>What do you want to build?</h1>
                </div>
                <div class="chat-thread" id="chat-history"></div>
            </div>

            <div class="composer-wrap">
                <div class="file-chip" id="file-preview-chip" hidden>
                    <span id="file-preview-name">file.pdf</span>
                    <button class="icon-btn" id="remove-file-btn" title="Remove file" aria-label="Remove file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>

                <form class="composer" id="composer">
                    <input type="file" id="file-input" hidden accept=".pdf,.doc,.docx,.png,.jpg,.json,.txt">
                    <button type="button" class="icon-btn" id="attach-btn" title="Attach a file" aria-label="Attach a file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <textarea id="chat-input" rows="1" placeholder="Describe your project"></textarea>
                    <button type="submit" class="send-btn" id="send-btn" title="Send" aria-label="Send">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </form>

                <div class="starters">
                    <button type="button" class="starter" data-text="I want to build a SaaS web app with React and FastAPI, with login and subscription billing.">SaaS web app</button>
                    <button type="button" class="starter" data-text="I need an e-commerce mobile app for iOS and Android with Stripe checkout.">E-commerce app</button>
                    <button type="button" class="starter" data-text="I want an AI chatbot that replies to Instagram and WhatsApp DMs for my business.">AI chatbot</button>
                    <button type="button" class="starter" data-text="I need an internal analytics dashboard for my company.">Analytics dashboard</button>
                </div>

                <p class="composer-note">AI responses can be wrong. Double-check estimates before you commit.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
