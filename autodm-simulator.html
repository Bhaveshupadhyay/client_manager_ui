    <main class="page">
        <h1 class="page-title">Auto-DM demo</h1>
        <p class="page-lead">A scripted preview of the Auto-DM bot. Pick a platform and send a message to see how it replies.</p>

        <div class="demo">
            <div class="demo-tabs" role="tablist">
                <button type="button" class="demo-tab active" data-channel="instagram">Instagram</button>
                <button type="button" class="demo-tab" data-channel="whatsapp">WhatsApp</button>
                <button type="button" class="demo-tab" data-channel="messenger">Messenger</button>
                <button type="button" class="demo-tab" data-channel="twitter">X</button>
                <button type="button" class="demo-tab" data-channel="web">Website chat</button>
            </div>

            <div class="demo-body" id="sim-chat-body"></div>

            <div class="demo-footer">
                <div class="starters">
                    <button type="button" class="starter" data-sim-prompt="What are your rates and delivery timeline for a custom Auto-DM bot?">Rates and timeline</button>
                    <button type="button" class="starter" data-sim-prompt="Can this bot auto-reply to Instagram story mentions, reels and DMs?">Story mentions</button>
                    <button type="button" class="starter" data-sim-prompt="How does it qualify leads on WhatsApp and book Calendly calls?">Qualify leads</button>
                    <button type="button" class="starter" data-sim-prompt="Can one bot handle Instagram, WhatsApp, and Web simultaneously?">Multiple platforms</button>
                </div>
                <form class="composer" id="sim-form">
                    <textarea id="sim-custom-input" rows="1" maxlength="140" placeholder="Type a message"></textarea>
                    <button type="submit" class="send-btn" title="Send" aria-label="Send">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>

    <footer class="site-footer">

            <div class="site-footer-links">
                <a href="mailto:bhaveshupadhyay929@gmail.com">Email</a>
                <a href="https://www.fiverr.com/coderandroid" target="_blank" rel="noopener noreferrer">Fiverr</a>
            </div>
        </div>
    </footer>
    <script>
        // Scripted Auto-DM demo: canned replies per keyword, no backend calls
        const simWelcome = {
            instagram: { name: 'Instagram DM', text: 'Hi, this is the Auto-DM bot on Instagram. Whenever someone sends a DM, mentions your story or comments on a post, I reply right away, any time of day. Try a message below.' },
            whatsapp: { name: 'WhatsApp Business', text: 'Hi, this is the Auto-DM bot on WhatsApp Business. When a client or lead messages you, day or night, I reply immediately, answer their questions and qualify them. How can I help?' },
            messenger: { name: 'Facebook Messenger', text: 'Hi, this is the Auto-DM bot on Messenger. When someone messages your page, I reply within seconds so leads never go cold. Try a message below.' },
            twitter: { name: 'X (Twitter) DM', text: 'Hi, this is the Auto-DM bot on X. When someone sends a DM, I reply instantly with information, links and next steps. What would you like to test?' },
            web: { name: 'Website chat', text: 'Hi, this is the Auto-DM bot on your website. The same bot works on Instagram, WhatsApp, Messenger and X. Try a message below.' }
        };
        let currentSimChannel = 'instagram';
        // Bumped on every channel switch so replies still pending from the old channel are dropped
        let simGeneration = 0;

        const simBody = document.getElementById('sim-chat-body');
        const simInput = document.getElementById('sim-custom-input');

        function escapeSimHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function appendSimMessage(html, isUser) {
            simBody.insertAdjacentHTML('beforeend', `<div class="msg ${isUser ? 'msg-user' : 'msg-ai'}"><div class="msg-content">${html}</div></div>`);
            simBody.scrollTop = simBody.scrollHeight;
        }

        function switchSimChannel(channel) {
            simGeneration++;
            currentSimChannel = channel;
            document.querySelectorAll('.demo-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.channel === channel);
            });
            simBody.innerHTML = '';
            appendSimMessage(simWelcome[channel].text, false);
        }

        function getSimBotReply(query) {
            const lower = query.toLowerCase();
            if (lower.includes('rate') || lower.includes('cost') || lower.includes('price') || lower.includes('pricing') || lower.includes('timeline') || lower.includes('fee') || lower.includes('package') || lower.includes('quote') || lower.includes('how much')) {
                return 'Custom Auto-DM bots usually cost <strong>$350 to $750</strong>, depending on which platforms and CRM automations you need. Delivery is typically <strong>3 to 5 business days</strong>. You can <a href="index.html?prompt=I%20want%20to%20build%20an%20Auto-DM%20AI%20Chatbot">get an estimate in the chat</a> or order on Fiverr.';
            } else if (lower.includes('tone') || lower.includes('voice') || lower.includes('persona') || lower.includes('training') || lower.includes('style') || lower.includes('match') || lower.includes('learn') || lower.includes('sound like')) {
                return 'The bot is trained on your past messages, emails and FAQs, so it picks up how you write: your phrasing, sentence length and the things you never say. Replies sound like you, not like a template.';
            } else if (lower.includes('simultaneously') || lower.includes('multi-channel') || lower.includes('multi channel') || lower.includes('any social media') || lower.includes('social platform') || (lower.includes('instagram') && lower.includes('whatsapp'))) {
                return 'Yes. One bot can connect to Instagram and Messenger (Meta Graph API), WhatsApp (Cloud API), X (API v2) and a website chat widget at the same time. All conversations land in one inbox.';
            } else if (lower.includes('instagram') || lower.includes('story') || lower.includes('stories') || lower.includes('mention') || lower.includes('reels') || lower.includes('comment')) {
                return 'Yes. On Instagram the bot uses the official <strong>Meta Graph API</strong> to reply to DMs, story mentions and keyword comments on posts and reels.';
            } else if (lower.includes('whatsapp') || lower.includes('cloud api') || lower.includes('number')) {
                return 'On WhatsApp it uses the official <strong>WhatsApp Cloud API</strong>, with quick-reply buttons, product catalogs, appointment booking and automatic CRM records.';
            } else if (lower.includes('qualify') || lower.includes('lead') || lower.includes('discovery') || lower.includes('calendar') || lower.includes('calendly') || lower.includes('book') || lower.includes('call') || lower.includes('schedule')) {
                return 'The bot asks each new lead a few questions about their needs, budget and timeline. Good fits get your Calendly or Cal.com link right in the chat, and the lead is saved to your CRM.';
            } else if (lower.includes('human') || lower.includes('handoff') || lower.includes('escalat') || lower.includes('alert') || lower.includes('notify') || lower.includes('takeover')) {
                return 'It handles routine questions on its own. When a conversation needs you, such as a large deal or a sensitive request, it alerts you by Telegram, SMS or Slack so you can take over.';
            } else if (lower.includes('example') || lower.includes('live') || lower.includes('production') || lower.includes('project') || lower.includes('built') || lower.includes('portfolio') || lower.includes('share')) {
                return 'Take a look at <a href="portfolio.html">the work page</a> for projects that are live, including Edu Garcia Movimiento and CultureBox TV.';
            } else if (lower.includes('fiverr') || lower.includes('hire') || lower.includes('contract') || lower.includes('freelance') || lower.includes('available') || lower.includes('contact')) {
                return 'I am taking on new projects. You can hire me on <a href="https://www.fiverr.com/coderandroid" target="_blank" rel="noopener noreferrer">Fiverr</a> or use the <a href="contact.html">contact form</a>.';
            }
            return `This demo shows how the bot replies on <strong>${simWelcome[currentSimChannel].name}</strong>. Try one of the suggested messages, or ask about pricing, lead qualification or supported platforms.`;
        }

        function sendSimMessage(text) {
            const generation = simGeneration;
            appendSimMessage(escapeSimHtml(text), true);
            appendSimMessage('<span class="typing-dot"></span>', false);
            const typing = simBody.lastElementChild;
            setTimeout(() => {
                typing.remove();
                if (generation !== simGeneration) return;
                appendSimMessage(getSimBotReply(text), false);
            }, 450);
        }

        document.querySelectorAll('.demo-tab').forEach(tab => {
            tab.addEventListener('click', () => switchSimChannel(tab.dataset.channel));
        });

        document.querySelectorAll('[data-sim-prompt]').forEach(btn => {
            btn.addEventListener('click', () => sendSimMessage(btn.dataset.simPrompt));
        });

        document.getElementById('sim-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = simInput.value.trim();
            if (!val) return;
            simInput.value = '';
            sendSimMessage(val);
        });

        simInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                document.getElementById('sim-form').requestSubmit();
            }
        });

        switchSimChannel('instagram');
    </script>

    <script src="script.js"></script>
</body>
