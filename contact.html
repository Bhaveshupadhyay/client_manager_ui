<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">AI Client Manager</a>
            <nav class="site-nav" id="main-nav">
                <a href="index.html">Chat</a>
                <a href="service.html">Services</a>
                <a href="portfolio.html">Work</a>
                <a href="testimonials.html">Reviews</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <div class="site-header-actions">
                <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
                <button class="icon-btn mobile-only" id="mobile-menu-toggle" title="Menu" aria-label="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="page">
        <h1 class="page-title">Contact</h1>
        <p class="page-lead">Email me, hire me on Fiverr, or send a few details below.</p>

        <div class="contact-options">
            <a href="mailto:bhaveshupadhyay929@gmail.com" class="btn">bhaveshupadhyay929@gmail.com</a>
            <a href="https://www.fiverr.com/coderandroid" target="_blank" rel="noopener noreferrer" class="btn">Fiverr <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
        </div>

        <section class="section">
            <h2 class="section-title">Send a message</h2>
            <form id="contact-inquiry-form" class="form">
                <div class="form-row">
                    <div class="field">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label for="contact-category">Project type</label>
                        <select id="contact-category">
                            <option value="saas">Web or SaaS app</option>
                            <option value="mobile">Mobile app</option>
                            <option value="ai">AI or chatbot</option>
                            <option value="ecommerce">E-commerce</option>
                            <option value="other">Something else</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="contact-budget">Budget</label>
                        <select id="contact-budget">
                            <option value="5k-10k">$5,000 &ndash; $10,000</option>
                            <option value="10k-25k" selected>$10,000 &ndash; $25,000</option>
                            <option value="25k-50k">$25,000 &ndash; $50,000</option>
                            <option value="50k+">$50,000+</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="contact-message">What do you want to build?</label>
                    <textarea id="contact-message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>&copy; 2026 AI Client Manager</span>
            <div class="site-footer-links">
                <a href="mailto:bhaveshupadhyay929@gmail.com">Email</a>
                <a href="https://www.fiverr.com/coderandroid" target="_blank" rel="noopener noreferrer">Fiverr</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
